name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Derive preview alias
        id: alias
        run: |
          raw="${GITHUB_HEAD_REF}"
          alias="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-40)"
          if ! printf '%s' "$alias" | grep -Eq '^[a-z]'; then
            alias="pr-${{ github.event.pull_request.number }}"
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"

      - name: Upload Worker preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.alias.outputs.alias }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Comment preview URL on the pull request
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment-url }}
          ALIAS: ${{ steps.alias.outputs.alias }}
        with:
          script: |
            const body = [
              '## Preview site',
              '',
              `Stable alias: \`${process.env.ALIAS}-youneek-xyz.<account>.workers.dev\``,
              process.env.DEPLOYMENT_URL ? `Deployment: ${process.env.DEPLOYMENT_URL}` : 'Wrangler uploaded a version; check the job log for the preview URL.',
              '',
              'This upload does **not** change https://youneek.xyz. Merge to `main` to ship production.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const marker = '## Preview site'
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
